[package]
name = "win-audio-sessions"
version = "0.1.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/yggdrion/win-audio-sessions"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi9"] }
napi-derive = "3"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
]

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
